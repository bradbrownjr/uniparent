services:
  uniparent:
    image: ghcr.io/bradbrownjr/uniparent:latest
    # build: .    # uncomment to build from this checkout instead of pulling
    container_name: uniparent
    env_file: .env
    ports:
      - "8095:8095"
    volumes:
      - /mnt/user/appdata/uniparent:/data   # SQLite database; change for non-Unraid hosts
    restart: unless-stopped
